services:
  backend:
    build:
      context: ./backend      # โฟลเดอร์ที่เก็บ Dockerfile
      dockerfile: Dockerfile  # ชื่อไฟล์ข้างในโฟลเดอร์นั้น
    ports:
      - "5000:5000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env